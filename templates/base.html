<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title or "BIM360 Issues" }}</title>
  <style>
    :root {
      --bg: #f6f7f4;
      --paper: #ffffff;
      --ink: #1f2a2b;
      --muted: #5a6a6a;
      --accent: #0e7a6d;
      --line: #dce3dd;
      --chip: #eef5f3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 300px at 10% -5%, #dcefe9 0%, transparent 70%),
        radial-gradient(900px 250px at 100% 0%, #e9ede3 0%, transparent 65%),
        var(--bg);
    }
    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .top {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 16px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .logout-link {
      color: #0a5f88;
      font-size: 14px;
      font-weight: 600;
    }
    h1, h2, h3 { margin: 0 0 10px; }
    .sub { color: var(--muted); margin: 0; }
    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .row {
      display: grid;
      grid-template-columns: minmax(300px, 1.3fr) 1fr 160px 210px 220px;
      gap: 10px;
      align-items: center;
    }
    input, select, button {
      border: 1px solid #becac5;
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
    }
    button {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      cursor: pointer;
    }
    button:hover { filter: brightness(0.95); }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--line);
      padding: 10px 8px;
    }
    .chip {
      display: inline-block;
      background: var(--chip);
      color: #1d4f47;
      border: 1px solid #cce0d8;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 12px;
    }
    a { color: #0a5f88; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
    }
    .split-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(320px, 1fr);
      gap: 14px;
      align-items: start;
    }
    .split-panel {
      border-left: 1px solid var(--line);
      padding-left: 14px;
    }
    .photo {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
    }
    .photo img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
      background: #eef2ef;
      border: 1px solid #d9e2dc;
    }
    .kvs {
      display: grid;
      grid-template-columns: 170px 1fr;
      gap: 8px 14px;
      font-size: 14px;
    }
    .kvs .k { color: var(--muted); }
    @media (max-width: 900px) {
      .row { grid-template-columns: 1fr; }
      .kvs { grid-template-columns: 1fr; }
      .split-layout { grid-template-columns: 1fr; }
      .split-panel {
        border-left: none;
        border-top: 1px solid var(--line);
        padding-left: 0;
        padding-top: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="topbar">
        <h1>BIM360 Issue Explorer</h1>
        <div>
          {% if session.get("is_authenticated") %}
            <span class="sub">Innlogget som {{ session.get("user_name") }}</span>
            &nbsp;|&nbsp;
            <a class="logout-link" href="/logout">Logg ut</a>
          {% endif %}
        </div>
      </div>
      <p class="sub">Velg prosjekt, søk i issues, og drill ned til vedlegg/bilder.</p>
    </header>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
